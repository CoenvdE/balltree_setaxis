[build-system]
requires = ["setuptools", "wheel", "cython", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "balltree-setaxis"
version = "0.1.0"
description = "Ball tree with global PCA alignment for rotation-equivariant construction (based on balltree by Maksim Zhdanov)"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Coen van den Elsen"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "torch",
]

[project.urls]
Homepage = "https://github.com/CoenvdE/balltree_setaxis"
Repository = "https://github.com/CoenvdE/balltree_setaxis"
Issues = "https://github.com/CoenvdE/balltree_setaxis/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["balltree_setaxis*"]
exclude = ["tests*"]